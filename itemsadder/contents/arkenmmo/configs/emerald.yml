# ItemsAdder item for the emerald (spec: design/item-emerald.md).
# The model, texture and tooltip sprites are not here: `mise run itemsadder` copies them from
# resourcepack/assets/ into this content folder's resourcepack/assets/ when it builds the zip.
info:
  namespace: arkenmmo
items:
  emerald:
    display_name: Emerald
    resource:
      material: EMERALD
      generate: false
      model_path: arkenmmo:item/emerald
    # ItemsAdder tooltip id: tools/itemsadder.py copies textures/gui/sprites/tooltip/emerald_{background,frame}.png to textures/tooltip/
    tooltip_style: arkenmmo:tooltip/emerald
