# ItemsAdder items for the four accessories (spec: design/item-accessories.md).
# Models, textures and tooltip sprites are not here: `mise run itemsadder` copies them from resourcepack/assets/
# into this content folder's resourcepack/assets/ when it builds the zip.
info:
  namespace: arkenmmo
items:
  ring_1:
    display_name: Ring
    resource:
      material: PAPER
      generate: false
      model_path: arkenmmo:item/ring_1
    # vanilla tooltip_style id: textures/gui/sprites/tooltip/accessory_{background,frame}.png (shared by all four)
    tooltip_style: arkenmmo:accessory
  ring_2:
    display_name: Signet Ring
    resource:
      material: PAPER
      generate: false
      model_path: arkenmmo:item/ring_2
    tooltip_style: arkenmmo:accessory
  amulet:
    display_name: Amulet
    resource:
      material: PAPER
      generate: false
      model_path: arkenmmo:item/amulet
    tooltip_style: arkenmmo:accessory
  bracelet:
    display_name: Bracelet
    resource:
      material: PAPER
      generate: false
      model_path: arkenmmo:item/bracelet
    tooltip_style: arkenmmo:accessory
