name: Release

# Every push to main builds the jar and replaces the rolling "latest" release
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Build and test
        run: mise run build

      # target/resourcepack.zip (plain pack) and target/itemsadder-arkenmmo.zip (ItemsAdder content folder)
      - name: Build resource packs
        run: |
          mise run pack
          mise run itemsadder

      # The jar and both pack zips as release assets, so nobody needs the source archive
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/ArkenMMO-*.jar target/resourcepack.zip target/itemsadder-arkenmmo.zip \
            --target "$SHA" \
            --title "Latest build (${SHA::7})" \
            --notes "$(printf 'Automatic build of main at %s\n\n- ArkenMMO jar: the plugin\n- itemsadder-arkenmmo.zip: unzip into plugins/ItemsAdder/contents/, then /iazip\n- resourcepack.zip: the plain pack, only without ItemsAdder' "$SHA")"

      # One release per pack version, never replaced, so a URL and SHA-1 in a server's config stay valid
      - name: Publish resource pack release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          sha1=$(sha1sum target/resourcepack.zip | cut -d' ' -f1)
          tag="pack-${sha1::7}"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/resourcepack.zip"
          notes=$(printf 'ItemsAdder: unzip itemsadder-arkenmmo.zip into plugins/ItemsAdder/contents/ and run /iazip (keep resource-pack.enabled false).\n\nWithout ItemsAdder, config.yml under resource-pack:\n\n    url: "%s"\n    sha1: "%s"\n' "$url" "$sha1")
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" target/resourcepack.zip target/itemsadder-arkenmmo.zip \
              --target "$SHA" \
              --title "Resource pack ${sha1::7}" \
              --notes "$notes" \
              --latest=false
          fi
          echo "$notes" >> "$GITHUB_STEP_SUMMARY"
