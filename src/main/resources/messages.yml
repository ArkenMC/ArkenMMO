# All text players see, in MiniMessage format. Changes need a server restart.
# Missing keys fall back to the built-in text.
# The headings, class names and button labels painted into the menu art are part of the resource pack
# and don't change with this file.

class:
  chosen: "<green>You chose your class: <class>"
  current: "<gray>Your class is <class>"

command:
  players-only: "<red>Only players can choose a class. Use /class select <name>."
  select:
    # <player>; has-class also has <class>
    requested: "<gray>Class selection requested for <white><player></white>."
    has-class: "<red><player> already has a class: <class>"
  reset:
    # <player>; done also has <class>
    done: "<green><player> no longer has a class (was <class><green>)."
    no-class: "<red><player> has no class."

classes:
  warrior:
    name: "<#e8b33c>Warrior"
    description:
      - "<gray>A heavily armoured fighter"
      - "<gray>who meets foes head on."
  archer:
    name: "<#6abf4b>Archer"
    description:
      - "<gray>A keen-eyed hunter who"
      - "<gray>strikes from a distance."
  mage:
    name: "<#5aa9e6>Mage"
    description:
      - "<gray>A student of the arcane"
      - "<gray>who commands the elements."
  captain:
    name: "<#d9534f>Captain"
    description:
      - "<gray>A battlefield leader who"
      - "<gray>rallies and protects allies."

# Casting with a class weapon, shown above the hotbar.
casting:
  clicks:
    left: "L"
    right: "R"
    pending: "<dark_gray>?"
  # <first> <second> <third> are the names above; cast also has <skill>
  progress: "<gray><first> <dark_gray>-</dark_gray> <second> <dark_gray>-</dark_gray> <third>"
  cast: "<green><first> - <second> - <third>  <skill>"
  # <mana> and <max>
  mana: "<#7fc8e8>Mana <white><mana></white>/<max>"
  # <line> is the progress, cast or fail text; <mana_text> is the mana line above
  bar: "<line>  <dark_gray>|</dark_gray>  <mana_text>"
  # Why a cast failed; it cost nothing. All but "empty" have <skill>.
  fail:
    # <slot> (1-4)
    empty: "<red>Combo slot <slot> is empty"
    not-owned: "<skill> <red>isn't unlocked"
    passive: "<skill> <red>is passive"
    unavailable: "<skill> <red>can't be cast yet"
    # <seconds>
    cooldown: "<skill> <red>ready in <seconds>s"
    # <cost>
    mana: "<red>Not enough mana for <skill> <red>(<cost>)"
    no-target: "<skill><red>: no target"

menu:
  next-page: "<yellow>Next page"
  previous-page: "<yellow>Previous page"
  back: "<yellow>Back"
  # Shown under every class description
  panel-footer:
    - ""
    - "<red>Your choice is final."
    - "<yellow>Click to choose"
  confirm:
    # <class>
    name: "<green>Confirm: <class>"
    lore:
      - "<red>This choice is final."
  # Characters from the resource pack font that draw each menu's background. Only change them with the pack.
  titles:
    class-select-1: "<!shadow><white><font:arkenmmo:gui></font></white>"
    class-select-2: "<!shadow><white><font:arkenmmo:gui></font></white>"
    confirm-warrior: "<!shadow><white><font:arkenmmo:gui></font></white>"
    confirm-archer: "<!shadow><white><font:arkenmmo:gui></font></white>"
    confirm-mage: "<!shadow><white><font:arkenmmo:gui></font></white>"
    confirm-captain: "<!shadow><white><font:arkenmmo:gui></font></white>"
# The skill tree and loadout menus (/skills). Numbers in skill descriptions are placeholders filled from
# skill-values.yml. The name painted at the top of each page is part of the resource pack and doesn't
# change with this file.
skills:
  chat:
    players-only: "<red>Only players have a skill tree."
    no-class: "<gray>Choose a class first with <white>/class</white>."
    class-changed: "<red>Your class changed, so the skill menu closed."
    tree-invalid: "<yellow>Your skill tree no longer fits the rules, so it was emptied. Your points are free again."

  # <colour> in the lines below: each class's name colour
  colours:
    warrior: "<#e8b33c>"
    archer: "<#6abf4b>"
    mage: "<#5aa9e6>"
    captain: "<#d9534f>"

  hover:
    # A skill's hover: its name, "archetype" or "core", its description, "mana" (actives) and "cost"
    # (unbought stones in the tree), "combo" (filled loadout slots), then one block from "status".
    lines:
      # <archetype> and <type>
      archetype: "<#dcc291><archetype> <#8f8a80>- <gray><type>"
      # <class>
      core: "<#dcc291><class> core skill <#8f8a80>- <gray>Active"
      # <mana> and <cooldown>
      mana: "<#7fc8e8>Mana <white><mana></white>  <#7fc8e8>Cooldown <white><cooldown>s"
      # <cost>
      cost: "<gray>Point cost: <white><cost>"
      # <combo>
      combo: "<gray>Combo: <white><combo>"
    type:
      active: "Active"
      passive: "Passive"
    status:
      # Followed by one block from "requirements" for each unmet requirement
      locked:
        - "<red>Locked"
      available:
        - "<yellow>Click to unlock"
      confirm:
        - "<gold>Click again to unlock"
      owned:
        - "<green>Unlocked"
      undoable:
        - "<green>Unlocked just now"
        - "<yellow>Click to undo"
      # <cost>
      undo-confirm:
        - "<gold>Click again to undo"
        - "<gray>Points returned: <white><cost>"
      # <blocking>
      undo-refused:
        - "<green>Unlocked just now"
        - "<red>Undo <white><blocking></white> first"
      core:
        - "<green>Always yours, free"
    requirements:
      # <required>
      one-skill:
        - "<red>Needs <white><required>"
      # <required_a> and <required_b>
      either-skill:
        - "<red>Needs one of:"
        - " <white><required_a>"
        - " <white><required_b>"
      # <level>
      level:
        - "<red>Needs class level <white><level>"
      # <free>
      points:
        - "<red>Not enough points <gray>(<free> free)"
    # The blocks used in the loadout menu
    loadout:
      seat:
        - "<yellow>Click to clear"
      # <picked>
      seat-picked:
        - "<yellow>Click to place <white><picked>"
      pool-free:
        - "<yellow>Click to pick"
      # <combo>
      pool-assigned:
        - "<green>On combo <white><combo>"
        - "<yellow>Click to pick"
      pool-picked:
        - "<gold>Picked: click a seat"
      pool-locked:
        - "<red>Not unlocked"

  menu:
    sealed:
      # <archetype>
      name: "<gray>Sealed Stone"
      lore:
        - "<#dcc291><archetype>"
        - ""
        - "<#8f8a80>The carving is hidden."
        - "<#8f8a80>Not yet."
    # <colour>, <archetype> and <spent>; a line that is just <description> becomes the archetype's lines
    tab:
      name: "<colour><archetype>"
      lore:
        - "<#8f8a80>Archetype"
        - ""
        - "<description>"
        - ""
        - "<gray>Points spent: <white><spent>"
        - "<yellow>Click to view"
    tab-open:
      name: "<colour><archetype>"
      lore:
        - "<#8f8a80>Archetype"
        - ""
        - "<description>"
        - ""
        - "<gray>Points spent: <white><spent>"
        - "<green>You are viewing this"
    close:
      name: "<yellow>Close"
    back:
      name: "<yellow>Back to the skill tree"
    # <points>
    reset:
      name: "<yellow>Reset skills"
      lore:
        - "<gray>Points returned: <white><points>"
        - ""
        - "<yellow>Click to reset"
    # <points> and <cooldown>
    reset-confirm:
      name: "<gold>Reset your skills?"
      lore:
        - "<gray>Points returned: <white><points>"
        - "<gray>Next reset in <white><cooldown>s</white> after."
        - ""
        - "<gold>Click again to reset"
    # <seconds>; updates when you click or reopen the page
    reset-cooldown:
      name: "<#8f8a80>Reset skills"
      lore:
        - "<red>Ready again in <white><seconds>s"
    reset-empty:
      name: "<#8f8a80>Reset skills"
      lore:
        - "<red>Nothing to reset"
    scroll-down:
      name: "<yellow>Scroll down"
      lore:
        - "<gray>Higher tiers of this"
        - "<gray>archetype."
    scroll-up:
      name: "<yellow>Scroll up"
      lore:
        - "<gray>Lower tiers of this"
        - "<gray>archetype."
    loadout:
      name: "<yellow>Spell loadout"
      lore:
        - "<gray>Set your four combo spells."
        - ""
        - "<yellow>Click to open"
    # <class>, <level>, <max_level>, <free>, <archetype_1> to <archetype_3>, <spent_1> to <spent_3>
    info:
      name: "<yellow><class> skills"
      lore:
        - "<gray>Class level <white><level></white> of <white><max_level>"
        - "<#8f8a80>A test value: no XP yet."
        - "<gray>Free skill points: <white><free>"
        - ""
        - "<#dcc291><archetype_1><gray>: <white><spent_1>"
        - "<#dcc291><archetype_2><gray>: <white><spent_2>"
        - "<#dcc291><archetype_3><gray>: <white><spent_3>"
    loadout-info:
      name: "<yellow>How to cast"
      lore:
        - "<gray>Hold your class weapon and"
        - "<gray>click a three-click pattern."
        - "<gray>R is right, L is left."
        - ""
        - "<#8f8a80>For now only Warriors can cast,"
        - "<#8f8a80>with an iron sword: Cleave,"
        - "<#8f8a80>Leaping Strike, Whirlwind"
        - "<#8f8a80>and Execute."
    # <combo>
    seat-empty:
      name: "<gray>Empty seat"
      lore:
        - "<gray>Combo: <white><combo>"
        - ""
        - "<#8f8a80>Pick a skill below first."
    # <combo> and <picked>
    seat-empty-picked:
      name: "<gray>Empty seat"
      lore:
        - "<gray>Combo: <white><combo>"
        - ""
        - "<yellow>Click to place <white><picked>"

  archetypes:
    warrior:
      guardian:
        name: "Warrior's Courage"
        description:
          - "<gray>Hold the line: shields, shouts"
          - "<gray>and endurance."
      berserker:
        name: "Warrior's Rage"
        description:
          - "<gray>Charge in and keep swinging."
          - "<gray>Fury feeds the fight."
      duelist:
        name: "Warrior's Honour"
        description:
          - "<gray>Precise strikes against one"
          - "<gray>worthy foe."
    archer:
      marksman:
        name: "Archer's Focus"
        description:
          - "<gray>Careful, heavy shots from"
          - "<gray>a long way off."
      skirmisher:
        name: "Archer's Swiftness"
        description:
          - "<gray>Never stand still: speed and"
          - "<gray>a rain of arrows."
      hunter:
        name: "Archer's Instinct"
        description:
          - "<gray>Fire, frost, tracking and"
          - "<gray>a loyal wolf."
    mage:
      pyromancer:
        name: "Mage's Flame"
        description:
          - "<gray>Burn your foes with flame"
          - "<gray>and falling stars."
      frostweaver:
        name: "Mage's Frost"
        description:
          - "<gray>Slow, root and shatter with"
          - "<gray>ice."
      lifebinder:
        name: "Mage's Grace"
        description:
          - "<gray>Mend your allies and sear"
          - "<gray>your enemies with light."
    captain:
      vanguard:
        name: "Captain's Command"
        description:
          - "<gray>Mark the quarry and lead the"
          - "<gray>attack."
      standard_bearer:
        name: "Captain's Banner"
        description:
          - "<gray>Plant your colours and fight"
          - "<gray>beside your herald."
      warchanter:
        name: "Captain's Song"
        description:
          - "<gray>Gather Verses, then turn song"
          - "<gray>into steel and healing."

  # Every skill's name and what it does
  list:
    warrior:
      cleave:
        name: "<#e8b33c>Cleave"
        description:
          - "<gray>Sweep your weapon, hitting all"
          - "<gray>enemies in a <white><range></white>-block, <white><angle>-degree</white>"
          - "<gray>cone for <white><damage>%</white> power."
      shield_bash:
        name: "<#e8b33c>Shield Bash"
        description:
          - "<gray>Bash one enemy within <white><range></white> blocks"
          - "<gray>for <white><damage>%</white> power and stun it for <white><duration>s</white>."
      iron_hide:
        name: "<#e8b33c>Iron Hide"
        description:
          - "<gray>You take <white><reduction>%</white> less damage."
      stalwart:
        name: "<#e8b33c>Stalwart"
        description:
          - "<gray>Gain <white><health></white> max health and <white><resistance>%</white>"
          - "<gray>knockback resistance."
      challenging_shout:
        name: "<#e8b33c>Challenging Shout"
        description:
          - "<gray>Mobs within <white><radius></white> blocks attack you"
          - "<gray>for <white><duration>s</white>. You take <white><reduction>%</white> less damage"
          - "<gray>meanwhile."
      second_wind:
        name: "<#e8b33c>Second Wind"
        description:
          - "<gray>Dropping below <white><threshold>%</white> health heals"
          - "<gray><white><heal>%</white> of your max health. Once every"
          - "<gray><white><interval>s</white>."
      bulwark:
        name: "<#e8b33c>Bulwark"
        description:
          - "<gray>Raise a shield that absorbs <white><amount>%</white>"
          - "<gray>power for <white><duration>s</white>."
      leaping_strike:
        name: "<#e8b33c>Leaping Strike"
        description:
          - "<gray>Leap up to <white><range></white> blocks. Landing deals"
          - "<gray><white><damage>%</white> power to enemies within <white><radius></white>"
          - "<gray>blocks."
      bloodthirst:
        name: "<#e8b33c>Bloodthirst"
        description:
          - "<gray>Basic hits heal you for <white><heal>%</white> of the"
          - "<gray>damage dealt."
      fury:
        name: "<#e8b33c>Fury"
        description:
          - "<gray>Each hit gives <white><speed>%</white> attack speed for"
          - "<gray><white><duration>s</white>, up to <white><stacks></white> stacks."
      whirlwind:
        name: "<#e8b33c>Whirlwind"
        description:
          - "<gray>Spin for <white><duration>s</white>, striking <white><count></white> times"
          - "<gray>for <white><damage>%</white> power each in a <white><radius></white>-block"
          - "<gray>radius."
      relentless:
        name: "<#e8b33c>Relentless"
        description:
          - "<gray>Each kill restores <white><amount></white> mana."
      execute:
        name: "<#e8b33c>Execute"
        description:
          - "<gray>Hit one enemy for <white><damage>%</white> power, or"
          - "<gray><white><finisher>%</white> if it is below <white><threshold>%</white> health."
      lunge:
        name: "<#e8b33c>Lunge"
        description:
          - "<gray>Dash up to <white><range></white> blocks to the enemy"
          - "<gray>you aim at and strike it for <white><damage>%</white>"
          - "<gray>power."
      footwork:
        name: "<#e8b33c>Footwork"
        description:
          - "<gray>Gain <white><speed>%</white> move speed and <white><haste>%</white> attack"
          - "<gray>speed."
      focus:
        name: "<#e8b33c>Focus"
        description:
          - "<gray>Deal <white><bonus>%</white> more damage while only"
          - "<gray>one enemy is within <white><radius></white> blocks."
      riposte:
        name: "<#e8b33c>Riposte"
        description:
          - "<gray>Guard for <white><duration>s</white>. The first melee or"
          - "<gray>arrow hit is reduced <white><reduction>%</white>. A melee"
          - "<gray>attacker takes <white><damage>%</white> power back."
      opportunist:
        name: "<#e8b33c>Opportunist"
        description:
          - "<gray>Deal <white><bonus>%</white> more damage from behind,"
          - "<gray>or to slowed enemies."
      hamstring:
        name: "<#e8b33c>Hamstring"
        description:
          - "<gray>Cut one enemy for <white><damage>%</white> power and"
          - "<gray>slow it <white><slow>%</white> for <white><duration>s</white>."
    archer:
      vault:
        name: "<#6abf4b>Vault"
        description:
          - "<gray>Launch yourself backward about <white><range></white>"
          - "<gray>blocks. You take no fall damage on"
          - "<gray>landing."
      power_shot:
        name: "<#6abf4b>Power Shot"
        description:
          - "<gray>Fire a fast arrow that deals <white><damage>%</white>"
          - "<gray>power."
      eagle_eye:
        name: "<#6abf4b>Eagle Eye"
        description:
          - "<gray>Arrows deal <white><bonus>%</white> more damage beyond"
          - "<gray><white><range></white> blocks."
      steady_aim:
        name: "<#6abf4b>Steady Aim"
        description:
          - "<gray>After standing still <white><delay>s</white>, you"
          - "<gray>deal <white><bonus>%</white> more damage."
      piercing_shot:
        name: "<#6abf4b>Piercing Shot"
        description:
          - "<gray>Fire an arrow that passes through"
          - "<gray>up to <white><count></white> enemies for <white><damage>%</white> power."
      weak_spot:
        name: "<#6abf4b>Weak Spot"
        description:
          - "<gray><white><chance>%</white> chance to deal <white><damage>%</white> damage."
      hunters_mark:
        name: "<#6abf4b>Hunter's Mark"
        description:
          - "<gray>Mark a target for <white><duration>s</white>. It glows"
          - "<gray>and takes <white><bonus>%</white> more damage from"
          - "<gray>you."
      volley:
        name: "<#6abf4b>Volley"
        description:
          - "<gray>Fire <white><count></white> arrows in a spread for <white><damage>%</white>"
          - "<gray>power each. At most <white><limit></white> hit the same"
          - "<gray>target."
      fleet_foot:
        name: "<#6abf4b>Fleet Foot"
        description:
          - "<gray>Gain <white><speed>%</white> move speed."
      momentum:
        name: "<#6abf4b>Momentum"
        description:
          - "<gray>Arrow hits give <white><bonus>%</white> damage for <white><duration>s</white>,"
          - "<gray>up to <white><stacks></white> stacks."
      rapid_fire:
        name: "<#6abf4b>Rapid Fire"
        description:
          - "<gray>Loose <white><count></white> arrows over <white><duration>s</white> for <white><damage>%</white>"
          - "<gray>power each."
      light_step:
        name: "<#6abf4b>Light Step"
        description:
          - "<gray>Take <white><reduction>%</white> less fall damage. <white><chance>%</white>"
          - "<gray>chance to dodge a hit."
      tumble:
        name: "<#6abf4b>Tumble"
        description:
          - "<gray>Dash <white><range></white> blocks the way you move."
          - "<gray>Your next arrow within <white><duration>s</white> deals"
          - "<gray><white><bonus>%</white> more damage."
      flame_arrow:
        name: "<#6abf4b>Flame Arrow"
        description:
          - "<gray>Fire an arrow for <white><damage>%</white> power that"
          - "<gray>burns for <white><burn>%</white> power each second"
          - "<gray>for <white><duration>s</white>."
      tracker:
        name: "<#6abf4b>Tracker"
        description:
          - "<gray>Enemies you hit below <white><threshold>%</white> health"
          - "<gray>glow for <white><duration>s</white>."
      survivalist:
        name: "<#6abf4b>Survivalist"
        description:
          - "<gray>Out of combat, regain <white><heal>%</white> of max"
          - "<gray>health each second."
      wolf_companion:
        name: "<#6abf4b>Wolf Companion"
        description:
          - "<gray>Call a wolf for <white><duration>s</white>. It bites for"
          - "<gray><white><damage>%</white> power and has <white><health>%</white> of your"
          - "<gray>health."
      barbed_heads:
        name: "<#6abf4b>Barbed Heads"
        description:
          - "<gray><white><chance>%</white> chance to make a target bleed"
          - "<gray>for <white><damage>%</white> power each second for <white><duration>s</white>."
      frost_arrow:
        name: "<#6abf4b>Frost Arrow"
        description:
          - "<gray>Deal <white><damage>%</white> power and slow enemies"
          - "<gray>within <white><radius></white> blocks by <white><slow>%</white> for <white><duration>s</white>."
    mage:
      blink:
        name: "<#5aa9e6>Blink"
        description:
          - "<gray>Teleport up to <white><range></white> blocks where you"
          - "<gray>look, stopping before walls."
      fireball:
        name: "<#5aa9e6>Fireball"
        description:
          - "<gray>Throw a fireball that deals <white><damage>%</white>"
          - "<gray>power in <white><radius></white> blocks."
      kindling:
        name: "<#5aa9e6>Kindling"
        description:
          - "<gray>Your fire spells burn for <white><burn>%</white>"
          - "<gray>power each second for <white><duration>s</white>."
      inner_heat:
        name: "<#5aa9e6>Inner Heat"
        description:
          - "<gray>Deal <white><bonus>%</white> more damage while above"
          - "<gray><white><threshold>%</white> mana."
      flame_wave:
        name: "<#5aa9e6>Flame Wave"
        description:
          - "<gray>Burst a <white><range></white>-block cone of fire for"
          - "<gray><white><damage>%</white> power and knock enemies back."
      ash_siphon:
        name: "<#5aa9e6>Ash Siphon"
        description:
          - "<gray>When a burning enemy dies, restore"
          - "<gray><white><amount></white> mana."
      meteor:
        name: "<#5aa9e6>Meteor"
        description:
          - "<gray>Call a meteor within <white><range></white> blocks."
          - "<gray>After <white><delay>s</white> it deals <white><damage>%</white> power in"
          - "<gray><white><radius></white> blocks."
      ice_lance:
        name: "<#5aa9e6>Ice Lance"
        description:
          - "<gray>Hurl ice up to <white><range></white> blocks for <white><damage>%</white>"
          - "<gray>power and slow the target <white><slow>%</white> for"
          - "<gray><white><duration>s</white>."
      chill_touch:
        name: "<#5aa9e6>Chill Touch"
        description:
          - "<gray>Your slows last <white><duration>s</white> longer."
      frost_armor:
        name: "<#5aa9e6>Frost Armor"
        description:
          - "<gray>Take <white><reduction>%</white> less damage. Melee"
          - "<gray>attackers are slowed <white><slow>%</white> for <white><duration>s</white>."
      frost_nova:
        name: "<#5aa9e6>Frost Nova"
        description:
          - "<gray>Deal <white><damage>%</white> power within <white><radius></white> blocks"
          - "<gray>and root enemies for <white><duration>s</white>. Players"
          - "<gray>and bosses are slowed <white><player_slow>%</white>"
          - "<gray>instead."
      shatter:
        name: "<#5aa9e6>Shatter"
        description:
          - "<gray>Deal <white><bonus>%</white> more damage to slowed or"
          - "<gray>rooted enemies."
      blizzard:
        name: "<#5aa9e6>Blizzard"
        description:
          - "<gray>Raise a storm up to <white><range></white> blocks"
          - "<gray>away, with a <white><radius></white>-block radius, for"
          - "<gray><white><duration>s</white>. It deals <white><damage>%</white> power each second"
          - "<gray>and slows by <white><slow>%</white>."
      mending_light:
        name: "<#5aa9e6>Mending Light"
        description:
          - "<gray>Heal the ally you aim at, up to <white><range></white>"
          - "<gray>blocks away, for <white><heal>%</white> power, or"
          - "<gray>yourself if there is none."
      gentle_soul:
        name: "<#5aa9e6>Gentle Soul"
        description:
          - "<gray>Your healing is <white><bonus>%</white> stronger."
      radiance:
        name: "<#5aa9e6>Radiance"
        description:
          - "<gray>Your heals add <white><heal>%</white> power of"
          - "<gray>healing over <white><duration>s</white>. It refreshes; it"
          - "<gray>does not stack."
      sanctuary:
        name: "<#5aa9e6>Sanctuary"
        description:
          - "<gray>Bless a <white><radius></white>-block circle for <white><duration>s</white>."
          - "<gray>Allies inside heal <white><heal>%</white> power each"
          - "<gray>second."
      smite:
        name: "<#5aa9e6>Smite"
        description:
          - "<gray>Your spell damage heals the most"
          - "<gray>hurt ally within <white><range></white> blocks for <white><heal>%</white>"
          - "<gray>of it."
      sunburst:
        name: "<#5aa9e6>Sunburst"
        description:
          - "<gray>Burst light <white><radius></white> blocks around you:"
          - "<gray><white><damage>%</white> power to enemies and <white><heal>%</white>"
          - "<gray>power healing to allies."
    captain:
      rallying_strike:
        name: "<#d9534f>Rallying Strike"
        description:
          - "<gray>Strike for <white><damage>%</white> power and heal you"
          - "<gray>and allies within <white><radius></white> blocks for <white><heal>%</white>"
          - "<gray>power. An Opening doubles the"
          - "<gray>heal."
      quarry_mark:
        name: "<#d9534f>Quarry Mark"
        description:
          - "<gray>Deal <white><damage>%</white> power at up to <white><range></white> blocks"
          - "<gray>and mark the target for <white><duration>s</white>. It"
          - "<gray>takes <white><bonus>%</white> more damage from you and"
          - "<gray>allies."
      hardened_resolve:
        name: "<#d9534f>Hardened Resolve"
        description:
          - "<gray>Spending an Opening: for <white><duration>s</white> take"
          - "<gray><white><reduction>%</white> less damage and heal <white><bonus>%</white> more."
      lead_from_the_front:
        name: "<#d9534f>Lead from the Front"
        description:
          - "<gray>Deal <white><bonus>%</white> more damage, and another"
          - "<gray><white><extra>%</white> to your marked enemy."
      press_the_attack:
        name: "<#d9534f>Press the Attack"
        description:
          - "<gray>Strike <white><count></white> times for <white><damage>%</white> power on up"
          - "<gray>to <white><targets></white> enemies within <white><range></white> blocks."
          - "<gray>Hitting your marked enemy grants"
          - "<gray>an Opening, once every <white><interval>s</white>."
      gallant_example:
        name: "<#d9534f>Gallant Example"
        description:
          - "<gray>Spending an Opening restores <white><amount></white>"
          - "<gray>mana."
      scattering_shout:
        name: "<#d9534f>Scattering Shout"
        description:
          - "<gray>Deal <white><damage>%</white> power within <white><radius></white> blocks."
          - "<gray>With an Opening: <white><opening>%</white> power and a"
          - "<gray><white><duration>s</white> stun."
      plant_standard:
        name: "<#d9534f>Plant Standard"
        description:
          - "<gray>Plant a banner for <white><duration>s</white>, hitting"
          - "<gray>foes within <white><strike_radius></white> blocks for <white><damage>%</white>"
          - "<gray>power. Allies within <white><radius></white> blocks of"
          - "<gray>it deal <white><bonus>%</white> more damage."
      tall_colours:
        name: "<#d9534f>Tall Colours"
        description:
          - "<gray>Your standard reaches <white><radius></white> blocks"
          - "<gray>farther and lasts <white><duration>s</white> longer."
      close_ranks:
        name: "<#d9534f>Close Ranks"
        description:
          - "<gray>Take <white><reduction>%</white> less damage inside your"
          - "<gray>standard or within <white><range></white> blocks of"
          - "<gray>your herald."
      call_herald:
        name: "<#d9534f>Call Herald"
        description:
          - "<gray>Call a herald for <white><duration>s</white>. It strikes"
          - "<gray>for <white><damage>%</white> power every <white><interval>s</white> and has"
          - "<gray><white><health>%</white> of your health."
      steadfast_company:
        name: "<#d9534f>Steadfast Company"
        description:
          - "<gray>Your herald has <white><health>%</white> more health."
          - "<gray>Your standard heals allies <white><heal>%</white>"
          - "<gray>power each second."
      sworn_bond:
        name: "<#d9534f>Sworn Bond"
        description:
          - "<gray>Bond the ally you aim at within"
          - "<gray><white><range></white> blocks, else your herald or"
          - "<gray>yourself, for <white><duration>s</white>. They get"
          - "<gray>a <white><shield>%</white> power shield for <white><shield_duration>s</white>"
          - "<gray>and <white><bonus>%</white> more damage. If not"
          - "<gray>you, you gain <white><self_bonus>%</white> more."
      war_ballad:
        name: "<#d9534f>War Ballad"
        description:
          - "<gray>Sing at an enemy within <white><range></white> blocks"
          - "<gray>for <white><damage>%</white> power and gain <white><count></white> Verse."
      stirring_melody:
        name: "<#d9534f>Stirring Melody"
        description:
          - "<gray>Each Verse gives <white><bonus>%</white> damage and <white><reduction>%</white>"
          - "<gray>less damage taken."
      long_refrain:
        name: "<#d9534f>Long Refrain"
        description:
          - "<gray>Your Verses last <white><duration>s</white> longer."
      anthem_of_courage:
        name: "<#d9534f>Anthem of Courage"
        description:
          - "<gray>Needs a Verse; keeps it. Allies"
          - "<gray>within <white><radius></white> blocks heal <white><heal>%</white> power"
          - "<gray>per Verse over <white><duration>s</white>."
      clear_voice:
        name: "<#d9534f>Clear Voice"
        description:
          - "<gray>Heal <white><bonus>%</white> more. Anthem also gives"
          - "<gray><white><speed>%</white> move speed for <white><duration>s</white>."
      coda:
        name: "<#d9534f>Coda"
        description:
          - "<gray>Needs <white><verses></white> Verse. Spend all"
          - "<gray>Verses. Per Verse, deal"
          - "<gray><white><damage>%</white> power to enemies and heal"
          - "<gray>allies <white><heal>%</white> power within <white><radius></white> blocks."

