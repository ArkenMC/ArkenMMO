# Game event -> sound. Retune here; the plugin plays sounds only through these names.
#
# key:       the sound played. arkenmmo: keys come from the resource pack (sent by ItemsAdder);
#            any minecraft: key works too.
# fallback:  vanilla minecraft: sound, used only when 'key' is blank or not a valid sound key.
#            The server cannot tell whether a client has a custom sound, and the game plays
#            nothing for a key the pack lacks (there is no automatic fallback). If the custom
#            sounds are silent in game, copy each fallback into its 'key'.
# volume:    above 0, at most 1.0.
# pitch-min, pitch-max: each play picks a random pitch in this range (0.5 to 2.0).
# source:    volume slider: master, music, records, weather, blocks, hostile, neutral, players,
#            ambient, voice or ui.
#
# Volume and pitch are tuned for the custom sounds; the fallback uses the same values.

combo_click_left:
  key: "arkenmmo:ui.combo_click_left"
  fallback: "minecraft:block.note_block.hat"
  volume: 0.35
  pitch-min: 0.99
  pitch-max: 1.01
  source: ui

combo_click_right:
